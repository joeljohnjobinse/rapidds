[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rapidds"
version = "0.2.2"
description = "A beginner-friendly guided dataset companion for simpler data science."
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name="Joel John Jobinse" }
]
license = { text = "MIT" }
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "openpyxl>=3.1"
]


[tool.setuptools.packages.find]
where = ["."]
include = ["rapidds*"]
