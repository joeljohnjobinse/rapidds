[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rapidds"
version = "0.2.1"
description = "An explainable data analysis and cleaning toolkit for Python"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

authors = [
    {name = "Joel John Jobinse"}
]

dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "matplotlib>=3.6"
]

[tool.setuptools.packages.find]
include = ["rapidds*"]
exclude = [
    "data*",
    "manual_tests*",
    "node_modules*",
    "tests*"
]